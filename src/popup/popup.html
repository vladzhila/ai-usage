<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360" />
    <title>AI Usage Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">AI USAGE</h1>
        <button class="refresh" id="refresh" title="Refresh">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12a9 9 0 11-2.636-6.364" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
      </header>

      <main class="cards" id="cards">
        <!-- Claude Card -->
        <article class="card" data-service="claude">
          <div class="card-head">
            <span class="name">Claude</span>
            <span class="dot" data-status="loading"></span>
          </div>
          <div class="card-body" data-state="loading">
            <div class="loader"></div>
          </div>
          <div class="card-body" data-state="logged_out" style="display: none">
            <p class="prompt">
              Log into <a href="https://claude.ai" target="_blank">claude.ai</a> to see usage
            </p>
          </div>
          <div class="card-body" data-state="error" style="display: none">
            <p class="error" data-field="error">Error loading data</p>
          </div>
          <div class="card-body" data-state="ok" style="display: none">
            <div class="row">
              <span class="label">PLAN</span>
              <span class="badge" data-field="plan">Pro</span>
            </div>
            <div class="row">
              <span class="label">USAGE</span>
              <span class="value"
                ><span data-field="used">0</span> / <span data-field="limit">0</span></span
              >
            </div>
            <div class="progress">
              <div class="bar" data-field="bar" style="width: 0%"></div>
            </div>
            <div class="row">
              <span class="label">RESETS</span>
              <span class="muted" data-field="reset">--</span>
            </div>
          </div>
        </article>

        <!-- Codex Card -->
        <article class="card" data-service="codex">
          <div class="card-head">
            <span class="name">Codex</span>
            <span class="dot" data-status="loading"></span>
          </div>
          <div class="card-body" data-state="loading">
            <div class="loader"></div>
          </div>
          <div class="card-body" data-state="logged_out" style="display: none">
            <p class="prompt">
              Log into <a href="https://chatgpt.com/codex" target="_blank">Codex</a> to see usage
            </p>
          </div>
          <div class="card-body" data-state="error" style="display: none">
            <p class="error" data-field="error">Error loading data</p>
          </div>
          <div class="card-body" data-state="ok" style="display: none">
            <div class="row">
              <span class="label">PLAN</span>
              <span class="badge" data-field="plan">Plus</span>
            </div>
            <div class="row">
              <span class="label">SESSION</span>
              <span class="value"><span data-field="session-used">0</span>%</span>
            </div>
            <div class="progress">
              <div class="bar" data-field="session-bar" style="width: 0%"></div>
            </div>
            <div class="row row-sub">
              <span class="label">RESETS</span>
              <span class="muted" data-field="session-reset">--</span>
            </div>
            <div class="row">
              <span class="label">WEEKLY</span>
              <span class="value"><span data-field="weekly-used">0</span>%</span>
            </div>
            <div class="progress">
              <div class="bar" data-field="weekly-bar" style="width: 0%"></div>
            </div>
            <div class="row">
              <span class="label">RESETS</span>
              <span class="muted" data-field="weekly-reset">--</span>
            </div>
          </div>
        </article>
      </main>

      <div class="scanlines"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
